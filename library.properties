name=QuackPack-DuckDisplay
version=1.1.0
author=Brenton Poke
maintainer=OWL Integrations <support@owlintegrations.com>
sentence=OLED display QuackPack for ClusterDuck Protocol
paragraph=This QuackPack drives a Duck's OLED with U8g2 without blocking the Duck's loop. It shows the duck's ID, type and status, and the last packet it received or sent: topic, origin or destination, a short payload preview, and RSSI and SNR for received packets. It takes the OLED controller and pins from the ClusterDuck Protocol board headers, or uses any U8g2 driver the sketch provides. It needs a ClusterDuck Protocol project, which provides the board pins and logging.
category=Display
url=https://github.com/Project-Owl/QuackPack-DuckDisplay.git
architectures=esp32
includes=DuckDisplay.h
depends=U8g2
