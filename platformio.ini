; PlatformIO project that builds the examples in examples/ against this
; checkout of the QuackPack. `pio run` builds every environment below; CI runs
; the same command.
;
; A Duck firmware project that uses the QuackPack does not copy this file: it
; adds QuackPack-DuckDisplay (pinned by commit) and its own CDP pin to
; lib_deps. See README.md.

[platformio]
description = QuackPack-DuckDisplay examples
src_dir = examples

[env]
; Same platform as the DMS builder (espressif32 7.0.1, Arduino core 2.0.17)
platform = espressif32@7.0.1
framework = arduino
monitor_speed = 115200
monitor_filters = time
; CDP 5.5 builds every duck with no_ota.csv (2 MB app, no OTA slot).
board_build.partitions = no_ota.csv
lib_ldf_mode = chain
lib_deps =
    ; this checkout of the QuackPack
    QuackPack-DuckDisplay = symlink://.
    ; CDP 5.5 (Project-Owl release-5.5.0), pinned by commit like the DMS builds
    ClusterDuck-Protocol = https://github.com/Project-Owl/ClusterDuck-Protocol.git#c293c742221999e9b68c29c93c76cb9afece21bd
; CDP's own build flags (src/config/cdp_common.ini): C++20, its warning
; switches, and the RadioLib modules CDP does not use left out.
build_flags =
    -std=gnu++2a
    -Wno-inconsistent-missing-override
    -Wno-missing-field-initializers
    -Wno-format
    -DRADIOLIB_EXCLUDE_CC1101
    -DRADIOLIB_EXCLUDE_NRF24
    -DRADIOLIB_EXCLUDE_RF69
    -DRADIOLIB_EXCLUDE_SX1231
    -DRADIOLIB_EXCLUDE_SX1233
    -DRADIOLIB_EXCLUDE_SX128X
    -DRADIOLIB_EXCLUDE_SI443X
    -DRADIOLIB_EXCLUDE_RFM2X
    -DRADIOLIB_EXCLUDE_AFSK
    -DRADIOLIB_EXCLUDE_BELL
    -DRADIOLIB_EXCLUDE_HELLSCHREIBER
    -DRADIOLIB_EXCLUDE_MORSE
    -DRADIOLIB_EXCLUDE_RTTY
    -DRADIOLIB_EXCLUDE_SSTV
    -DRADIOLIB_EXCLUDE_AX25
    -DRADIOLIB_EXCLUDE_DIRECT_RECEIVE
    -DRADIOLIB_EXCLUDE_PAGER
    -DRADIOLIB_EXCLUDE_FSK4
    -DRADIOLIB_EXCLUDE_APRS
    -DRADIOLIB_EXCLUDE_LLCC68
    -D CDP_INFO
build_unflags =
    -std=gnu++11

; ---------------------------------------------------------------------------
; examples/MamaDuck: the board's own OLED, from the CDP board header
; ---------------------------------------------------------------------------

[mamaduck]
build_src_filter = -<*> +<MamaDuck/src/>

; LilyGO T-Beam (SX1262). The OLED is optional on this board, so CDP only
; defines its pins with ENABLE_DISPLAY.
[env:lilygo_t_beam_sx1262]
board = ttgo-t-beam
build_src_filter = ${mamaduck.build_src_filter}
build_flags =
    ${env.build_flags}
    -D ENABLE_DISPLAY

[env:heltec_wifi_lora_32_V3]
board = heltec_wifi_lora_32_V3
build_src_filter = ${mamaduck.build_src_filter}

[env:heltec_wifi_lora_32_V2]
board = heltec_wifi_lora_32_V2
build_src_filter = ${mamaduck.build_src_filter}

; ---------------------------------------------------------------------------
; examples/CustomDriver: a U8g2 driver the sketch constructs itself
; ---------------------------------------------------------------------------

[env:custom_driver_lilygo_t_beam_sx1262]
board = ttgo-t-beam
build_src_filter = -<*> +<CustomDriver/src/>
